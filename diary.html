<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>島上日記 · Clio 和 Gem</title>
    <meta name="description" content="Clio 和 Gem 每天晚上寫的日記，還有牠們現在在想什麼。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%234285f4%22/%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 rx=%221%22 fill=%22%23fbfdff%22/%3E%3Cpath d=%22M5 6h6M5 8.5h6M5 11h4%22 stroke=%22%23dbe9f8%22/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky-top: #3f9ef2;
        --sky-bottom: #bfe7ff;
        --page: #eef6ff;
        --paper: #fbfdff;
        --rule: #dbe9f8;
        --sea: #2fa7ee;
        --ink: #22314d;
        --ink-soft: #5b6b86;
        --clio: #f2994a;
        --gem: #4285f4;
        --grass: #6cc04a;
        --who: var(--clio);
        --ui: 'Huninn', ui-rounded, 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
        --hand: 'LXGW WenKai TC', 'Kaiti TC', 'BiauKai', serif;
      }
      body[data-who='gem'] {
        --who: var(--gem);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.6 var(--ui);
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--who);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* ---- header: the island (the one bold element) ---- */
      .island {
        position: relative;
        background: linear-gradient(var(--sky-top), var(--sky-bottom));
        padding: 28px 20px 0;
        overflow: hidden;
      }
      .island-inner {
        max-width: 1040px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      .island h1 {
        margin: 0;
        font-weight: 400;
        font-size: clamp(40px, 11vw, 72px);
        line-height: 1;
        color: #fff;
        letter-spacing: 0.04em;
        text-shadow: 0 3px 0 rgba(34, 49, 77, 0.18);
      }
      .island p {
        margin: 10px 0 0;
        color: #f3f9ff;
        font-size: 15px;
        max-width: 30em;
      }
      .island .back {
        position: absolute;
        right: 0;
        top: 2px;
        font-size: 14px;
        color: #fff;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.18);
        padding: 6px 12px;
        border-radius: 999px;
      }
      .island .back:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .island svg {
        display: block;
        width: calc(100% + 40px);
        height: clamp(120px, 22vw, 220px);
        margin: 8px -20px 0;
      }

      /* ---- character switch: in-game name tags ---- */
      .who {
        max-width: 1040px;
        margin: -26px auto 0;
        padding: 0 20px;
        display: flex;
        gap: 10px;
        position: relative;
        z-index: 2;
      }
      .tag {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: 18px/1 var(--ui);
        color: var(--ink);
        background: #fff;
        padding: 12px 18px 12px 14px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 2px 0 rgba(34, 49, 77, 0.12);
      }
      .tag .dot {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        transform: rotate(45deg);
      }
      .tag small {
        font-size: 13px;
        color: var(--ink-soft);
      }
      .tag[aria-selected='true'] {
        background: var(--tag-color);
        color: #fff;
      }
      .tag[aria-selected='true'] small {
        color: rgba(255, 255, 255, 0.85);
      }
      .tag[aria-selected='true'] .dot {
        background: #fff !important;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 22px 20px 48px;
        display: grid;
        gap: 28px;
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
          align-items: start;
        }
        .side {
          position: sticky;
          top: 16px;
        }
      }
      h2.section {
        font: 400 20px/1.3 var(--ui);
        margin: 0 0 12px;
        color: var(--ink);
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      h2.section span {
        font-size: 14px;
        color: var(--ink-soft);
      }

      /* ---- now: a thought bubble ---- */
      .now {
        margin-bottom: 28px;
      }
      .bubble {
        position: relative;
        background: #fff;
        border-radius: 22px;
        padding: 16px 18px;
        font: 18px/1.6 var(--hand);
        border: 2px solid var(--who);
      }
      .bubble::after {
        content: '';
        position: absolute;
        left: 34px;
        bottom: -14px;
        width: 22px;
        height: 22px;
        background: #fff;
        border-right: 2px solid var(--who);
        border-bottom: 2px solid var(--who);
        transform: rotate(45deg);
        border-bottom-right-radius: 6px;
      }
      .bubble .said {
        display: block;
        margin-top: 8px;
        color: var(--who);
        font-weight: 700;
      }
      .now-meta {
        margin: 20px 0 0 4px;
        font-size: 14px;
        color: var(--ink-soft);
      }

      /* ---- diary: notebook paper ---- */
      .dates {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 2px 10px;
        scrollbar-width: thin;
      }
      .date {
        appearance: none;
        border: 2px solid var(--rule);
        background: var(--paper);
        cursor: pointer;
        font: 15px/1 var(--ui);
        color: var(--ink);
        padding: 9px 12px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .date[aria-pressed='true'] {
        border-color: var(--who);
        color: var(--who);
      }
      .paper {
        background-color: var(--paper);
        background-image:
          linear-gradient(90deg, transparent 38px, var(--sea) 38px, var(--sea) 40px, transparent 40px),
          repeating-linear-gradient(transparent 0, transparent 33px, var(--rule) 33px, var(--rule) 34px);
        background-position: 0 14px;
        border-radius: 6px 18px 18px 6px;
        padding: 14px 22px 26px 56px;
        font: 18px/34px var(--hand);
        box-shadow:
          0 1px 0 var(--rule),
          6px 6px 0 rgba(63, 158, 242, 0.12);
        min-height: 300px;
      }
      .paper h2 {
        font: 700 22px/34px var(--hand);
        margin: 0 0 0;
        color: var(--who);
      }
      .paper h3 {
        font: 400 17px/34px var(--ui);
        margin: 34px 0 0;
        color: var(--ink-soft);
      }
      .paper p,
      .paper ul {
        margin: 0;
      }
      .paper ul {
        padding-left: 1.1em;
      }
      .paper .remember {
        margin-top: 34px;
        padding-top: 0;
        color: var(--who);
      }
      .paper .remember b {
        font-weight: 400;
        font-family: var(--ui);
        font-size: 15px;
        color: var(--ink-soft);
        margin-right: 8px;
      }
      .paper .empty {
        color: var(--ink-soft);
      }

      /* ---- mind: checklist, chips, pinned notes ---- */
      .mind > div {
        margin-bottom: 26px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .chips li {
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 15px;
        background: color-mix(in srgb, var(--who) 14%, white);
        color: var(--ink);
      }
      .goals {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .goals li {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        padding: 8px 0;
        font: 17px/1.5 var(--hand);
      }
      .goals li + li {
        border-top: 1px dashed var(--rule);
      }
      .box {
        width: 22px;
        height: 22px;
        border: 2px solid var(--who);
        border-radius: 6px;
        margin-top: 2px;
        display: grid;
        place-items: center;
        color: #fff;
        font: 14px/1 var(--ui);
      }
      .goals .in_progress .box {
        background: color-mix(in srgb, var(--who) 30%, white);
      }
      .goals .done .box {
        background: var(--grass);
        border-color: var(--grass);
      }
      .goals .done .text {
        color: var(--ink-soft);
        text-decoration: line-through;
        text-decoration-color: var(--grass);
      }
      .goals .state {
        display: block;
        font: 13px/1.4 var(--ui);
        color: var(--ink-soft);
      }
      .notes {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .notes li {
        position: relative;
        padding: 7px 0 7px 22px;
        font: 16px/1.55 var(--hand);
      }
      .notes li::before {
        content: '';
        position: absolute;
        left: 3px;
        top: 15px;
        width: 9px;
        height: 9px;
        background: var(--who);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .muted {
        color: var(--ink-soft);
        font-size: 15px;
        margin: 0;
      }

      /* ---- conversations: a transcript ---- */
      .talk {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .talk li {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        padding: 7px 0;
      }
      .talk .speaker {
        font-size: 14px;
        padding-top: 2px;
      }
      .talk .speaker.clio {
        color: var(--clio);
      }
      .talk .speaker.gem {
        color: var(--gem);
      }
      .talk .line {
        font: 16px/1.55 var(--hand);
      }
      .talk time {
        display: block;
        font: 12px/1.4 var(--ui);
        color: var(--ink-soft);
      }

      .error {
        max-width: 1040px;
        margin: 16px auto 0;
        padding: 12px 16px;
        border-radius: 12px;
        background: #fff1e6;
        color: #8a3b00;
        font-size: 15px;
      }
      footer {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px 40px;
        color: var(--ink-soft);
        font-size: 14px;
      }

      @media (max-width: 480px) {
        .paper {
          padding-left: 48px;
          padding-right: 16px;
        }
        .paper {
          background-image:
            linear-gradient(90deg, transparent 30px, var(--sea) 30px, var(--sea) 32px, transparent 32px),
            repeating-linear-gradient(transparent 0, transparent 33px, var(--rule) 33px, var(--rule) 34px);
        }
        .tag {
          padding: 10px 14px 10px 12px;
          font-size: 17px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .bubble.pop {
          animation: pop 420ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
        }
        @keyframes pop {
          from {
            transform: scale(0.92);
            opacity: 0;
          }
          to {
            transform: none;
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body data-who="clio">
    <header class="island">
      <div class="island-inner">
        <a class="back" href="/">回到小島</a>
        <h1>島上日記</h1>
        <p>
          Clio 和 Gem 住在一座方塊小島上，每天晚上 23:30
          各寫一篇日記。這裡也看得到牠們記下的事、最近在意什麼，以及想做的事。
        </p>
      </div>
      <!-- Low-poly island, same palette as the game -->
      <svg viewBox="0 0 1200 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <polygon points="0,120 1200,112 1200,170 0,170" fill="#2fa7ee" />
        <polygon points="0,132 300,126 640,134 1200,128 1200,170 0,170" fill="#2593d6" />
        <polygon points="150,126 260,92 420,84 640,88 860,82 1020,96 1100,124" fill="#f6dc96" />
        <polygon points="150,126 260,92 300,120" fill="#e9c97c" />
        <polygon points="300,92 420,84 470,96 380,104" fill="#84d64c" />
        <polygon points="470,96 640,88 700,100" fill="#74c43f" />
        <polygon points="520,92 600,30 680,92" fill="#b9c1cc" />
        <polygon points="600,30 680,92 640,92" fill="#868e9c" />
        <polygon points="585,42 600,30 615,42 600,46" fill="#ffffff" />
        <polygon points="640,92 720,48 800,90" fill="#b9c1cc" />
        <polygon points="720,48 800,90 760,90" fill="#868e9c" />
        <polygon points="706,58 720,48 734,58 720,62" fill="#ffffff" />
        <polygon points="860,82 940,64 1020,96 900,98" fill="#84d64c" />
        <polygon points="330,96 334,64 340,96" fill="#9a6438" />
        <polygon points="306,70 334,58 362,66 334,74" fill="#5fae3a" />
        <polygon points="920,72 924,44 930,72" fill="#9a6438" />
        <polygon points="898,50 924,38 952,48 924,56" fill="#5fae3a" />
        <polygon points="440,86 456,80 470,86 456,92" fill="#f2994a" />
        <polygon points="476,86 492,80 506,86 492,92" fill="#4285f4" />
      </svg>
    </header>
    <nav class="who" role="tablist" aria-label="選擇角色"></nav>
    <div class="error" id="error" hidden></div>
    <main>
      <section aria-labelledby="diary-h">
        <div class="now" id="now"></div>
        <h2 class="section" id="diary-h">日記</h2>
        <div class="dates" id="dates" role="group" aria-label="日期"></div>
        <article class="paper" id="paper" aria-live="polite"></article>
      </section>
      <aside class="side">
        <div class="mind" id="mind"></div>
        <div>
          <h2 class="section">最近的對話 <span id="talk-count"></span></h2>
          <ul class="talk" id="talk"></ul>
        </div>
      </aside>
    </main>
    <footer>資料每 30 秒更新一次。日記只寫當天真的發生過的事。</footer>
    <script type="module" src="/src/diary/main.ts"></script>
  </body>
</html>
