<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%235fae3a%22/%3E%3Crect y=%225%22 width=%2216%22 height=%2211%22 fill=%22%238a5a36%22/%3E%3C/svg%3E" />
    <title>LLM Voxel World</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87b5e8; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #debug {
        position: fixed; top: 8px; left: 8px; padding: 6px 8px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #fff; background: rgba(0, 0, 0, 0.55); border-radius: 4px;
        white-space: pre; pointer-events: none;
      }
      #debug[hidden] { display: none; }

      /* --- play UI: cute, rounded, light --- */
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
        pointer-events: none; opacity: 0.85;
        background:
          linear-gradient(#fff, #fff) center / 2px 18px no-repeat,
          linear-gradient(#fff, #fff) center / 18px 2px no-repeat;
        filter: drop-shadow(0 0 1px rgba(0,0,0,.6));
      }
      #hotbar {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
        font-family: ui-rounded, "Nunito", system-ui, sans-serif;
      }
      .hotbar-row {
        display: flex; gap: 6px; padding: 7px; border-radius: 18px;
        background: rgba(255,255,255,.55); backdrop-filter: blur(6px);
        box-shadow: 0 6px 18px rgba(30,60,90,.18);
      }
      .slot {
        position: relative; width: 50px; height: 50px; border-radius: 12px;
        background: rgba(255,255,255,.7); display: grid; place-items: center;
        transition: transform .12s ease, background .12s ease;
      }
      .slot.active { background: #fff; transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 3px #ffd84a; }
      .slot .key { position: absolute; left: 6px; top: 3px; font-size: 10px; color: #8a8fa3; font-weight: 700; }
      .cube {
        width: 26px; height: 26px; border-radius: 6px; transform: rotate(45deg) skew(-8deg, -8deg);
        background: linear-gradient(135deg, var(--top) 0 50%, var(--side) 50% 100%);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
      }
      .hotbar-label {
        font-size: 14px; font-weight: 700; color: #2b2b3a; background: rgba(255,255,255,.8);
        padding: 3px 12px; border-radius: 999px; opacity: 0;
      }
      .hotbar-label.flash { animation: fadeLabel 1.6s ease forwards; }
      @keyframes fadeLabel { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

      #play-overlay {
        position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
        background: radial-gradient(ellipse at center, rgba(255,255,255,.15), rgba(40,80,130,.35));
        font-family: ui-rounded, "Nunito", system-ui, sans-serif; color: #2b2b3a;
      }
      #play-overlay[hidden] { display: none; }
      .play-card {
        background: rgba(255,255,255,.88); border-radius: 24px; padding: 22px 30px; text-align: center;
        box-shadow: 0 12px 40px rgba(30,60,90,.25); max-width: 420px;
      }
      .play-card h1 { margin: 0 0 4px; font-size: 26px; }
      .play-card .go { margin: 10px 0 14px; font-size: 18px; font-weight: 800; color: #e2763a; }
      .play-card .keys { display: grid; grid-template-columns: auto auto; gap: 4px 14px; font-size: 13px; text-align: left; }
      .play-card kbd {
        display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 6px; background: #eef2f8;
        border-bottom: 2px solid #cfd6e2; font: 700 12px ui-rounded, system-ui, sans-serif; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug" hidden></div>
    <div id="crosshair" hidden></div>
    <div id="hotbar" hidden></div>
    <div id="play-overlay" hidden>
      <div class="play-card">
        <h1>🏝️ LLM Voxel World</h1>
        <div class="go">點一下開始</div>
        <div class="keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</span><span><kbd>空白</kbd> 跳 / 游上去</span>
          <span><kbd>Shift</kbd> 衝刺</span><span><kbd>F</kbd> 飛行開關（<kbd>C</kbd> 下降）</span>
          <span>左鍵 挖方塊</span><span>右鍵 放方塊</span>
          <span><kbd>1</kbd>–<kbd>9</kbd> / 滾輪 選方塊</span><span><kbd>F3</kbd> 效能面板 · <kbd>Esc</kbd> 暫停</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
