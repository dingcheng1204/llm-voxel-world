<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%235fae3a%22/%3E%3Crect y=%225%22 width=%2216%22 height=%2211%22 fill=%22%238a5a36%22/%3E%3C/svg%3E"
    />
    <title>LLM Voxel World</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87b5e8;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 8px;
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #debug[hidden] {
        display: none;
      }

      /* --- play UI: cute, rounded, light --- */
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        pointer-events: none;
        opacity: 0.85;
        background:
          linear-gradient(#fff, #fff) center / 2px 18px no-repeat,
          linear-gradient(#fff, #fff) center / 18px 2px no-repeat;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.6));
      }
      #hotbar {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        font-family: ui-rounded, 'Nunito', system-ui, sans-serif;
      }
      .hotbar-row {
        display: flex;
        gap: 6px;
        padding: 7px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(6px);
        box-shadow: 0 6px 18px rgba(30, 60, 90, 0.18);
      }
      .slot {
        position: relative;
        width: 50px;
        height: 50px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        display: grid;
        place-items: center;
        transition:
          transform 0.12s ease,
          background 0.12s ease;
      }
      .slot.active {
        background: #fff;
        transform: translateY(-4px) scale(1.08);
        box-shadow: 0 0 0 3px #ffd84a;
      }
      .slot .key {
        position: absolute;
        left: 6px;
        top: 3px;
        font-size: 10px;
        color: #8a8fa3;
        font-weight: 700;
      }
      .cube {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        transform: rotate(45deg) skew(-8deg, -8deg);
        background: linear-gradient(135deg, var(--top) 0 50%, var(--side) 50% 100%);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .hotbar-label {
        font-size: 14px;
        font-weight: 700;
        color: #2b2b3a;
        background: rgba(255, 255, 255, 0.8);
        padding: 3px 12px;
        border-radius: 999px;
        opacity: 0;
      }
      .hotbar-label.flash {
        animation: fadeLabel 1.6s ease forwards;
      }
      @keyframes fadeLabel {
        0%,
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      #diary-link {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        text-decoration: none;
        font:
          700 14px ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        color: #2b2b3a;
        background: rgba(255, 255, 255, 0.85);
        padding: 7px 14px;
        border-radius: 999px;
      }
      #diary-link:hover {
        background: #fff;
      }
      #minimap {
        position: fixed;
        top: 52px;
        right: 12px;
        z-index: 19;
        padding: 5px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 4px 14px rgba(30, 70, 120, 0.22);
        line-height: 0;
      }
      #minimap[hidden] {
        display: none;
      }
      #minimap canvas {
        display: block;
        border-radius: 10px;
        cursor: zoom-in;
      }
      #minimap.big canvas {
        cursor: zoom-out;
      }
      #minimap .map-toggle {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 3px 0 1px;
        border: 0;
        background: none;
        font:
          700 12px/1.3 ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        color: #4a5570;
        cursor: pointer;
      }
      #minimap .map-toggle:focus-visible {
        outline: 2px solid #2fa7ee;
        border-radius: 6px;
      }
      #play-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.15), rgba(40, 80, 130, 0.35));
        font-family: ui-rounded, 'Nunito', system-ui, sans-serif;
        color: #2b2b3a;
      }
      #play-overlay[hidden],
      #hotbar[hidden],
      #crosshair[hidden] {
        display: none;
      }
      .play-card {
        background: rgba(255, 255, 255, 0.88);
        border-radius: 24px;
        padding: 22px 30px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(30, 60, 90, 0.25);
        max-width: 420px;
      }
      .play-card h1 {
        margin: 0 0 4px;
        font-size: 26px;
      }
      .join {
        margin: 12px 0 14px;
        display: grid;
        gap: 10px;
        text-align: left;
      }
      .join label.name {
        font-size: 13px;
        font-weight: 700;
        color: #5b6b86;
      }
      .join input[type='text'] {
        font:
          600 17px ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        color: #2b2b3a;
        border: 2px solid #cfd6e2;
        border-radius: 12px;
        padding: 9px 12px;
        width: 100%;
        margin-top: 4px;
      }
      .join input[type='text']:focus {
        outline: none;
        border-color: #e2763a;
      }
      .join fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .join legend {
        font-size: 13px;
        font-weight: 700;
        color: #5b6b86;
        margin-bottom: 4px;
        padding: 0;
      }
      .join fieldset label {
        cursor: pointer;
      }
      .join fieldset input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .join fieldset span {
        display: grid;
        place-items: center;
        gap: 2px;
        padding: 8px 4px;
        border-radius: 14px;
        border: 2px solid #e3e8f0;
        background: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      .join fieldset span b {
        font-size: 26px;
        line-height: 1.1;
      }
      .join fieldset input:checked + span {
        border-color: #e2763a;
        background: #fff4ea;
      }
      .join fieldset input:focus-visible + span {
        outline: 3px solid #4285f4;
        outline-offset: 2px;
      }
      .join .err {
        min-height: 1em;
        margin: 0;
        color: #c2410c;
        font-size: 13px;
      }
      .play-card .go {
        appearance: none;
        border: 0;
        cursor: pointer;
        border-radius: 14px;
        padding: 11px 16px;
        font:
          800 18px ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        color: #fff;
        background: #e2763a;
      }
      .play-card .go:hover {
        background: #d0652b;
      }

      /* ---- chat window ---- */
      .chat,
      .chat-pill {
        position: fixed;
        left: 12px;
        bottom: 86px; /* above the hotbar */
        z-index: 25;
        font:
          14px/1.45 ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        color: #2b2b3a;
      }
      .chat {
        width: min(360px, calc(100vw - 24px));
        background: rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        box-shadow: 0 6px 24px rgba(30, 60, 90, 0.18);
        display: flex;
        flex-direction: column;
      }
      .chat[hidden],
      .chat-pill[hidden] {
        display: none;
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 6px 14px;
      }
      .chat-head strong {
        font-size: 15px;
        margin-right: auto;
      }
      .chat-head button,
      .chat-pill {
        appearance: none;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        padding: 4px 10px;
        background: #eef2f8;
        font:
          700 13px ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        color: #2b2b3a;
      }
      .chat-head button:hover {
        background: #e2e8f2;
      }
      .chat-pill {
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 14px;
        box-shadow: 0 4px 16px rgba(30, 60, 90, 0.18);
      }
      .chat-roster {
        margin: 0 14px 6px;
        font-size: 13px;
        color: #5b6b86;
      }
      .chat-list {
        list-style: none;
        margin: 0;
        padding: 4px 14px;
        max-height: 30vh;
        min-height: 90px;
        overflow-y: auto;
        overscroll-behavior: contain;
        border-top: 1px solid #eef2f8;
      }
      .chat-list li {
        padding: 3px 0;
        overflow-wrap: anywhere;
      }
      .chat-list li.mine {
        background: #fff7ef;
        margin: 0 -8px;
        padding: 3px 8px;
        border-radius: 8px;
      }
      .chat-list time {
        color: #8a93a6;
        font-size: 12px;
        margin-right: 6px;
        font-variant-numeric: tabular-nums;
      }
      .chat-list .who {
        font-weight: 800;
      }
      .chat-list .arrow {
        color: #8a93a6;
        margin: 0 3px;
      }
      .chat-list .to {
        color: #5b6b86;
        font-weight: 700;
        margin-right: 6px;
      }
      .chat-list .to.direct {
        color: #2b2b3a;
      }
      .chat-form {
        display: flex;
        gap: 6px;
        padding: 8px 10px 4px;
        border-top: 1px solid #eef2f8;
      }
      .chat-to,
      .chat-input,
      .chat-send {
        font:
          14px ui-rounded,
          'Nunito',
          system-ui,
          sans-serif;
        border-radius: 10px;
      }
      .chat-to {
        border: 1px solid #cfd6e2;
        background: #fff;
        padding: 6px;
        max-width: 110px;
        color: #2b2b3a;
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        border: 1px solid #cfd6e2;
        padding: 6px 10px;
        color: #2b2b3a;
      }
      .chat-input:focus,
      .chat-to:focus {
        outline: 2px solid #4285f4;
        outline-offset: 0;
        border-color: transparent;
      }
      .chat-send {
        appearance: none;
        border: 0;
        background: #4285f4;
        color: #fff;
        font-weight: 800;
        padding: 6px 12px;
        cursor: pointer;
      }
      .chat-status {
        margin: 0;
        padding: 0 14px 8px;
        font-size: 12px;
        color: #c2410c;
        min-height: 4px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .play-card .keys {
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 14px;
        font-size: 13px;
        text-align: left;
      }
      .play-card kbd {
        display: inline-block;
        min-width: 18px;
        padding: 1px 6px;
        border-radius: 6px;
        background: #eef2f8;
        border-bottom: 2px solid #cfd6e2;
        font:
          700 12px ui-rounded,
          system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug" hidden></div>
    <div id="crosshair" hidden></div>
    <div id="hotbar" hidden></div>
    <a id="diary-link" href="/diary" target="_blank" rel="noopener">島上日記</a>
    <div id="play-overlay" hidden>
      <div class="play-card">
        <h1>🏝️ LLM Voxel World</h1>
        <form id="join" class="join" novalidate>
          <label class="name" for="join-name"
            >你的名字
            <input
              id="join-name"
              type="text"
              maxlength="16"
              placeholder="例如：小丁"
              autocomplete="nickname"
            />
          </label>
          <fieldset>
            <legend>你想當</legend>
            <label
              ><input type="radio" name="species" value="snake" /><span><b>🐍</b>蛇</span></label
            >
            <label
              ><input type="radio" name="species" value="tiger" checked /><span><b>🐯</b>老虎</span></label
            >
            <label
              ><input type="radio" name="species" value="monkey" /><span><b>🐵</b>猴子</span></label
            >
          </fieldset>
          <p id="join-error" class="err" role="alert"></p>
          <button type="submit" class="go">進入小島</button>
        </form>
        <div class="keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</span
          ><span><kbd>空白</kbd> 跳 / 游上去</span> <span><kbd>Shift</kbd> 衝刺</span
          ><span><kbd>F</kbd> 飛行開關（<kbd>C</kbd> 下降）</span> <span>左鍵 挖方塊</span
          ><span>右鍵 放方塊</span> <span><kbd>1</kbd>–<kbd>9</kbd> / 滾輪 選方塊</span
          ><span><kbd>T</kbd> 聊天（<kbd>Enter</kbd> 送出）</span> <span><kbd>M</kbd> 地圖放大縮小</span
          ><span><kbd>F3</kbd> 效能面板 · <kbd>Esc</kbd> 暫停</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
